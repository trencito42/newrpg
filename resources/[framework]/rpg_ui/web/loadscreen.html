<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07090b;color:#f3f0e8;font-family:Inter,system-ui,sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 70% 35%,#243540 0,#10171c 30%,#07090b 68%)}
    main{width:min(560px,80vw);text-align:center}.mark{display:inline-block;color:#d6ad62;font-size:11px;font-weight:800;letter-spacing:.28em}
    h1{margin:14px 0 24px;font:500 48px Georgia,serif}.line{height:2px;background:#24292d;overflow:hidden}.line i{display:block;width:35%;height:100%;background:#d6ad62;animation:travel 1.6s ease-in-out infinite}
    p{color:#8f969a;font-size:13px;letter-spacing:.08em}@keyframes travel{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
  </style>
</head>
<body><main><span class="mark">BLIPMADE RPG</span><h1>Los Santos is preparing.</h1><div class="line"><i></i></div><p>Synchronizing your connection</p></main></body>
</html>
