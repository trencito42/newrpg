    <style rel="stylesheet" crossorigin>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;--blaze-orange: #F97316;--blaze-orange-dark: #EA580C;--blaze-orange-light: #FDBA74;--blaze-dark: #0a0a0c;--blaze-panel: rgba(15, 16, 20, .94);--blaze-border: rgba(255, 255, 255, .08);--text-main: #ffffff;--text-muted: #9ca3af;--text-dim: #6b7280}*{box-sizing:border-box;margin:0;padding:0}:root,html,body,#app{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:transparent!important;background-color:transparent!important;color:var(--text-main);-webkit-font-smoothing:antialiased}button,input{font:inherit}.hidden{display:none!important}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background-color:var(--blaze-dark);background-image:radial-gradient(circle at 50% 50%,rgba(249,115,22,.05) 0%,transparent 60%),radial-gradient(circle at 75% 30%,rgba(234,88,12,.04) 0%,transparent 50%);user-select:none;z-index:100}.auth-wrapper{position:relative;width:100%;max-width:440px;padding:1.5rem;display:flex;flex-direction:column;align-items:center}.auth-logo-area{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:1.75rem}.auth-flame{filter:drop-shadow(0 0 15px rgba(249,115,22,.35));margin-bottom:.75rem}.logo-flame{fill:url(#orange-gradient)}.auth-brand-title{font-size:2.5rem;font-weight:900;font-style:italic;letter-spacing:-.05em;color:#fff;line-height:1;text-shadow:0 0 15px rgba(249,115,22,.3)}.auth-brand-subtitle{font-size:.6875rem;font-weight:700;letter-spacing:.3em;color:#6b7280;margin-top:.25rem;text-transform:uppercase}.glass-panel{width:100%;background:var(--blaze-panel);border:1px solid var(--blaze-border);border-radius:1rem;padding:2rem;position:relative;overflow:hidden;box-shadow:0 25px 50px -12px #000000b3,0 0 0 1px #ffffff08}.auth-view{transition:opacity .25s ease,transform .25s ease;width:100%}.hidden-view{opacity:0;pointer-events:none;position:absolute;transfor 800;letter-spacing:-.03em}.cinematic p{margin:0;color:#d1d5db;font-size:1.0625rem;line-height:1.5}.cinematic-progress{position:absolute;left:7vw;bottom:7vh;width:min(400px,60vw);height:3px;background:#ffffff26;border-radius:2px;overflow:hidden}.cinematic-progress i{display:block;width:0;height:100%;background:var(--blaze-orange);box-shadow:0 0 10px #f9731699}@keyframes progress{to{width:100%}}.chat{position:fixed;left:20px;top:24px;width:min(540px,45vw);pointer-events:none;z-index:60}.chat-messages{max-height:280px;overflow:hidden;display:flex;flex-direction:column;gap:3px}.chat-line{margin:1px 0;padding:3px 8px;color:#fff;font-size:.875rem;font-weight:500;line-height:1.35;overflow-wrap:anywhere;background:#00000073;border-radius:4px;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.8);width:fit-content;max-width:100%}.chat-line.system,.chat-line.info{color:#93c5fd}.chat-line.success{color:#86efac}.chat-line.warning{color:#fde047}.chat-line.error{color:#fca5a5}.chat-line.admin{color:#ff6b6b;font-weight:700}.chat-line.helper{color:#86efac}.chat-line.private{color:#f59e0b}.chat-form{display:none;grid-template-columns:auto 1fr;align-items:center;gap:8px;margin-top:8px;padding:7px 12px;pointer-events:auto;background:#0c0e12d1;border:1px solid rgba(255,255,255,.1);border-left:3px solid var(--blaze-orange);border-radius:6px;box-shadow:0 8px 24px #00000080}.chat.open .chat-form{display:grid}.chat-form input{margin:0;padding:4px 6px;background:transparent;border:0;outline:none;color:#fff;font-size:.875rem}.prompt{color:var(--blaze-orange);font-size:1.25rem;font-weight:700}.notifications{position:fixed;right:28px;top:34px;display:flex;flex-direction:column;gap:10px;width:min(360px,40vw);z-index:80;pointer-events:none}.notice{padding:12px 16px;color:#f3f4f6;background:#0f1115eb;border:1px solid rgba(255,255,255,.08);border-left:3px solid #60a5fa;border-radius:6px;box-shadow:0 10px 30px #00000080;font-size:.875rem;line-height:1.4;animation:enter .25s cubic-bezier(.2,.8,.2,1);transition:all .3s ease}.notice.success{border-left-color:#22c55e}.notice.warning{border-left-color:#f59e0b}.notice.error{border-left-color:#ef4444}.notice.info{border-left-color:var(--blaze-orange)}.notice.leaving{opacity:0;transform:translate(20px)}@keyframes enter{0%{opacity:0;transform:translate(24px)}}@media(max-width:900px){.auth-wrapper{padding:1rem}.chat{width:calc(100vw - 48px)}}</style>
  </head>
  <body>
    <main id="app">
      <!-- AUTHENTICATION SCREEN -->
      <section id="auth" class="screen hidden" aria-label="Account authentication">
        <div class="auth-wrapper">
          <!-- Logo Area -->
          <div class="auth-logo-area">
            <svg class="auth-flame" width="64" height="74" viewBox="0 0 72 84" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FDBA74" />
                  <stop offset="50%" stop-color="#F97316" />
                  <stop offset="100%" stop-color="#9A3412" />
                </linearGradient>
              </defs>
              <path class="logo-flame" d="M36,0 C36,0 20,20 20,40 C20,55 30,65 30,65 C30,65 25,55 28,45 C28,45 15,55 10,70 C5,85 20,84 36,84 C52,84 67,85 62,70 C57,55 44,45 44,45 C47,55 42,65 42,65 C42,65 52,55 52,40 C52,20 36,0 36,0 Z" fill="url(#orange-gradient)" />
              <path d="M36,20 C36,20 28,35 28,50 C28,58 33,65 33,65 C33,65 30,58 32,52 C32,52 24,60 21,70 C18,80 28,79 36,79 C44,79 54,80 51,70 C48,60 40,52 40,52 C42,58 39,65 39,65 C39,65 44,58 44,50 C44,35 36,20 36,20 Z" fill="#0a0a0c" opacity="0.6"/>
            </svg>
            <h1 class="auth-brand-title">RPG</h1>
            <p class="auth-brand-subtitle">AUTHENTICATION</p>
          </div>

          <!-- Glass Container -->
          <div class="glass-panel">
            <!-- LOGIN VIEW -->
            <div id="login-view" class="auth-view active-view">
              <div class="view-header">
                <h2>Welcome Back</h2>
                <p>Enter your credentials to enter the server.</p>
              </div>

              <form id="login-form" autocomplete="off">
                <!-- Username -->
                <div class="form-group">
                  <label for="login-username">Username</label>
                  <div class="input-wrap">
                    <span class="input-icon">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                    <input type="text" id="login-username" name="username" class="input-field" placeholder="Enter your username" minlength="3" maxlength="24" autocomplete="username" required />
                  </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                  <label for="login-password">Password</label>
                  <div class="input-wrap">
                    <span class="input-icon">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                    <input type="password" id="login-password" name="password" class="input-field" placeholder="••••••••••" minlength="10" maxlength="128" autocomplete="current-password" required />
                  </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">
                  <span class="btn-text">SIGN IN</span>
                  <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
              </form>

              <!-- Footer Switch -->
              <div class="view-footer">
                <span>New player?</span>
                <button type="button" id="switch-to-register" class="link-btn">Create an Account</button>
              </div>
            </div>

            <!-- REGISTER VIEW -->
            <div id="register-view" class="auth-view hidden-view">
              <div class="view-header">
                <h2>Create Account</h2>
                <p>Register your character profile to begin.</p>
              </div>

              <form id="register-form" autocomplete="off">
                <!-- Username -->
                <div class="form-group">
                  <label for="reg-username">Username</label>
                  <div class="input-wrap">
                    <span class="input-icon">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                    <input type="text" id="reg-username" name="username" class="input-field" placeholder="3-24 characters" minlength="3" maxlength="24" autocomplete="username" required />
                  </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                  <label for="reg-email">Email Address</label>
                  <div class="input-wrap">
                    <span class="input-icon">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </span>
                    <input type="email" id="reg-email" name="email" class="input-field" placeholder="name@example.com" maxlength="254" autocomplete="email" required />
                  </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                  <label for="reg-password">Password</label>
                  <div class="input-wrap">
                    <span class="input-icon">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                    <input type="password" id="reg-password" name="password" class="input-field" placeholder="10-128 characters" minlength="10" maxlength="128" autocomplete="new-password" required />
                  </div>
                </div>

                <!-- Sex Selection -->
                <div class="form-group">
                  <label>Character Gender</label>
                  <div class="gender-selector">
                    <label class="gender-option">
                      <input type="radio" name="sex" value="male" checked required />
                      <div class="gender-card">
                        <span class="gender-icon">♂</span>
                        <span class="gender-label">Male</span>
                      </div>
                    </label>
                    <label class="gender-option">
                      <input type="radio" name="sex" value="female" required />
                      <div class="gender-card">
                        <span class="gender-icon">♀</span>
                        <span class="gender-label">Female</span>
                      </div>
                    </label>
                  </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">
                  <span class="btn-text">CREATE ACCOUNT</span>
                  <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
              </form>

              <!-- Footer Switch -->
              <div class="view-footer">
                <span>Already have an account?</span>
                <button type="button" id="switch-to-login" class="link-btn">Log In</button>
              </div>
            </div>

            <!-- Error Banner -->
            <div id="auth-error" class="auth-error-banner hidden">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
              <span id="auth-error-text"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- CHAT COMPONENT -->
      <section id="chat" class="chat hidden" aria-label="Game chat">
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <span class="prompt">❯</span>
          <input id="chat-input" type="text" maxlength="280" placeholder="Type a message or /command..." />
        </form>
      </section>

      <!-- NOTIFICATIONS -->
      <aside id="notifications" class="notifications" aria-live="polite"></aside>

      <!-- ONBOARDING CINEMATIC -->
      <section id="cinematic" class="cinematic hidden" aria-label="Cinematic onboarding">
        <div class="cinematic-overlay">
          <div class="cinematic-copy">
            <span id="cinematic-kicker" class="cinematic-kicker">LOS SANTOS</span>
            <h2 id="cinematic-title" class="cinematic-title">WELCOME</h2>
            <p id="cinematic-description" class="cinematic-description"></p>
          </div>
          <div class="cinematic-progress">
            <i id="cinematic-progress-bar"></i>
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
