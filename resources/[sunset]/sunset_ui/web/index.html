<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blaze.mp — UI Shell</title>
    <!-- Fonts and icon glyphs are shell-level dependencies.  Dynamic modules
         can be mounted at any time, so these must exist before module CSS. -->
    <link rel="stylesheet" href="css/fonts.css?v=3">
    <link rel="stylesheet" href="assets/phosphor/phosphor.css?v=3">
    <link rel="stylesheet" href="css/base.css?v=2">
    <link rel="stylesheet" href="css/variables.css?v=3">
    <link rel="stylesheet" href="css/_cef_overrides.css?v=2">
    <link rel="stylesheet" href="css/components.css?v=8">
    <link rel="stylesheet" href="css/animations.css?v=8">
    <link rel="stylesheet" href="css/player_interaction.css?v=8">
    <link rel="stylesheet" href="css/quick-hotbar.css?v=8">
    <link rel="stylesheet" href="css/premium-factions.css?v=8">
    <link rel="stylesheet" href="css/clans.css?v=8">
</head>
<body>
    <!-- Dynamic UI Mount Point: Modules are loaded and injected on demand -->
    <div id="ui-root"></div>

    <div id="transition-root" class="transition-root hidden" aria-hidden="true">
        <div class="transition-spinner" aria-hidden="true"></div>
        <div id="transition-status" class="transition-status">Loading character...</div>
    </div>

    <!-- Global Persistent Shell Containers -->
    <div id="notifications" class="notifications notifications-container" aria-live="polite"></div>
    <div id="progress-root" class="progress-container hidden">
        <div class="progress-card">
            <div class="progress-label" id="progress-label">Action in progress...</div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Hunter Job Compass -->
    <div id="hunter-compass" class="hunter-compass hidden" aria-hidden="true">
        <svg class="hc-ring" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
            <circle cx="36" cy="36" r="34" fill="rgba(0,0,0,0.62)" stroke="rgba(255,190,0,0.75)" stroke-width="1.5"/>
            <text x="36" y="12" text-anchor="middle" fill="rgba(255,190,0,0.9)" font-size="9" font-weight="900" font-family="sans-serif">N</text>
            <text x="36" y="67" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="sans-serif">S</text>
            <text x="8"  y="39" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="sans-serif">W</text>
            <text x="64" y="39" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="sans-serif">E</text>
            <g id="hunter-compass-needle" transform-origin="36 36">
                <polygon points="36,14 39,36 36,42 33,36" fill="#ffbe00"/>
                <polygon points="36,42 39,36 36,58 33,36" fill="rgba(255,190,0,0.35)"/>
            </g>
        </svg>
        <div class="hc-info">
            <span class="hc-dist" id="hunter-compass-dist">--</span>
            <span class="hc-label" id="hunter-compass-label">Hunting Zone</span>
        </div>
    </div>

    <!-- Persistent Gameplay Overlays (Emote Wheel, Weapon Ammo, Player Interaction) -->
    <div id="weapon-ammo-hud" class="weapon-ammo-hud hidden" aria-hidden="true" aria-label="Weapon ammo">
        <span class="wah-clip" id="wah-clip">0</span>
        <span class="wah-sep">|</span>
        <span class="wah-reserve" id="wah-reserve">0</span>
    </div>

    <div id="emote-wheel" class="wheel-overlay hidden" aria-hidden="true">
        <div class="wheel-container" id="wheel-container">
            <div class="wheel-center">
                <div class="wheel-center-title" id="wheel-title">Emotes</div>
                <div class="wheel-center-desc" id="wheel-desc">Select one</div>
            </div>
        </div>
        <div class="wheel-hint">Eliberează [X] pentru a folosi</div>
    </div>

    <div id="player-interaction" class="player-interaction hidden" aria-hidden="true">
        <div class="pi-world-target hidden" id="pi-world-target">
            <div class="pi-target-name" id="pi-target-name">PLAYER</div>
            <div class="pi-target-action">
                <span>Hold</span>
                <div class="pi-key-circle-wrapper">
                    <span class="pi-key-letter" id="pi-key-letter">G</span>
                    <svg class="pi-key-svg" viewBox="0 0 36 36" aria-hidden="true">
                        <circle class="pi-circle-track" cx="18" cy="18" r="16"></circle>
                        <circle class="pi-circle-progress" id="pi-progress-ring" cx="18" cy="18" r="16"></circle>
                    </svg>
                </div>
                <span>To Interact</span>
            </div>
        </div>

        <div class="pi-screen-menu" id="pi-screen-menu">
            <div class="pi-menu-title" id="pi-menu-title">Acțiuni Jucător</div>
            <div class="pi-menu-items" id="pi-menu-items"></div>
            <div class="pi-input-panel hidden" id="pi-input-panel">
                <div class="pi-input-panel__label" id="pi-input-label"></div>
                <div class="pi-input-panel__row">
                    <input type="text" class="pi-input-panel__field" id="pi-input-field" autocomplete="off">
                    <button type="button" class="pi-input-panel__submit" id="pi-input-submit">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/module-loader.js?v=8"></script>
    <script src="js/hotbar.js?v=8"></script>
    <script src="js/player_interaction.js?v=8"></script>
    <script src="js/app.js?v=8"></script>
</body>
</html>
