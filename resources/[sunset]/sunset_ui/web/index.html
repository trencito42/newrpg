<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="shell.page_title">racket.cat — UI Shell</title>
    <!-- [AUDIT NUI-ERR] Global error boundary: forward JS errors to Lua so staff
         can diagnose NUI crashes without needing F8 logs from the player. -->
    <script>
        (function() {
            function reportError(payload) {
                try {
                    fetch('https://sunset_ui/nuiError', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) { /* swallow — NUI bridge may not be ready yet */ }
            }
            window.onerror = function(message, source, lineno, colno, error) {
                reportError({
                    type: 'onerror',
                    message: String(message),
                    source: String(source),
                    lineno: lineno,
                    colno: colno,
                    stack: error && error.stack ? String(error.stack).slice(0, 1200) : null
                });
                return false; // do not suppress default browser logging
            };
            window.addEventListener('unhandledrejection', function(event) {
                var reason = event.reason;
                reportError({
                    type: 'unhandledrejection',
                    message: reason instanceof Error ? reason.message : String(reason),
                    stack: reason instanceof Error && reason.stack ? String(reason.stack).slice(0, 1200) : null
                });
            });
        })();
    </script>
    <!-- Fonts and icon glyphs are shell-level dependencies.  Dynamic modules
         can be mounted at any time, so these must exist before module CSS. -->
    <link rel="stylesheet" href="css/fonts.css?v=3">
    <link rel="stylesheet" href="assets/fontawesome/css/all.css?v=1">
    <link rel="stylesheet" href="assets/phosphor/phosphor.css?v=3">
    <link rel="stylesheet" href="css/base.css?v=2">
    <link rel="stylesheet" href="css/variables.css?v=3">
    <link rel="stylesheet" href="css/tokens.css?v=1">
    <link rel="stylesheet" href="css/_cef_overrides.css?v=2">
    <link rel="stylesheet" href="css/components.css?v=8">
    <link rel="stylesheet" href="css/animations.css?v=8">
    <link rel="stylesheet" href="css/player_interaction.css?v=8">
    <link rel="stylesheet" href="css/quick-hotbar.css?v=8">
    <link rel="stylesheet" href="css/premium-factions.css?v=8">
    <link rel="stylesheet" href="css/fnc.css?v=2">
    <link rel="stylesheet" href="css/drugs.css?v=3">
    <link rel="stylesheet" href="css/lockpick.css?v=2">
    <link rel="stylesheet" href="css/changepass.css?v=1">
</head>
<body>
    <!-- Dynamic UI Mount Point: Modules are loaded and injected on demand -->
    <div id="ui-root"></div>

    <div id="transition-root" class="transition-root hidden" aria-hidden="true">
        <div class="transition-spinner" aria-hidden="true"></div>
        <div id="transition-status" class="transition-status" data-i18n="shell.loading_character">Loading character...</div>
    </div>

    <!-- Global Persistent Shell Containers -->
    <div id="notifications" class="notifications notifications-container" aria-live="polite"></div>
    <div id="progress-root" class="progress-container hidden">
        <div class="progress-card">
            <div class="progress-label" id="progress-label" data-i18n="shell.action_progress">Action in progress...</div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Hunter Job Compass -->
    <div id="hunter-compass" class="hunter-compass hidden" aria-hidden="true">
        <svg class="hc-ring" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
            <circle cx="36" cy="36" r="34" fill="rgba(0,0,0,0.62)" stroke="rgba(255,190,0,0.75)" stroke-width="1.5"/>
            <text x="36" y="12" text-anchor="middle" fill="rgba(255,190,0,0.9)" font-size="9" font-weight="900" font-family="sans-serif">N</text>
            <text x="36" y="67" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="sans-serif">S</text>
            <text x="8"  y="39" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="sans-serif">W</text>
            <text x="64" y="39" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="sans-serif">E</text>
            <g id="hunter-compass-needle" transform-origin="36 36">
                <polygon points="36,14 39,36 36,42 33,36" fill="#ffbe00"/>
                <polygon points="36,42 39,36 36,58 33,36" fill="rgba(255,190,0,0.35)"/>
            </g>
        </svg>
        <div class="hc-info">
            <span class="hc-dist" id="hunter-compass-dist">--</span>
            <span class="hc-label" id="hunter-compass-label" data-i18n="shell.hunting_zone">Hunting Zone</span>
        </div>
    </div>

    <!-- Persistent Gameplay Overlays (Emote Wheel, Weapon Ammo, Player Interaction) -->
    <div id="weapon-ammo-hud" class="weapon-ammo-hud hidden" aria-hidden="true" aria-label="Weapon ammo" data-i18n-aria="shell.weapon_ammo">
        <span class="wah-clip" id="wah-clip">0</span>
        <span class="wah-sep">|</span>
        <span class="wah-reserve" id="wah-reserve">0</span>
    </div>

    <div id="emote-wheel" class="wheel-overlay hidden" aria-hidden="true">
        <div class="wheel-container" id="wheel-container">
            <div class="wheel-center">
                <div class="wheel-center-title" id="wheel-title" data-i18n="shell.emotes">Emotes</div>
                <div class="wheel-center-desc" id="wheel-desc" data-i18n="shell.select_one">Select one</div>
            </div>
        </div>
        <div class="wheel-hint" data-i18n="shell.release_to_use">Release [X] to use</div>
    </div>

    <div id="player-interaction" class="player-interaction hidden" aria-hidden="true">
        <div class="pi-world-target hidden" id="pi-world-target">
            <div class="pi-target-name" id="pi-target-name" data-i18n="common.player">Player</div>
            <div class="pi-target-action">
                <span data-i18n="shell.hold">Hold</span>
                <div class="pi-key-circle-wrapper">
                    <span class="pi-key-letter" id="pi-key-letter">G</span>
                    <svg class="pi-key-svg" viewBox="0 0 36 36" aria-hidden="true">
                        <circle class="pi-circle-track" cx="18" cy="18" r="16"></circle>
                        <circle class="pi-circle-progress" id="pi-progress-ring" cx="18" cy="18" r="16"></circle>
                    </svg>
                </div>
                <span data-i18n="shell.to_interact">To Interact</span>
            </div>
        </div>

        <div class="pi-screen-menu" id="pi-screen-menu">
            <div class="pi-menu-title" id="pi-menu-title" data-i18n="shell.player_actions">Player Actions</div>
            <div class="pi-menu-items" id="pi-menu-items"></div>
            <div class="pi-input-panel hidden" id="pi-input-panel">
                <div class="pi-input-panel__label" id="pi-input-label"></div>
                <div class="pi-input-panel__row">
                    <input type="text" class="pi-input-panel__field" id="pi-input-field" autocomplete="off">
                    <button type="button" class="pi-input-panel__submit" id="pi-input-submit" data-i18n="common.ok">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div id="changepass-modal" class="changepass-overlay hidden" aria-hidden="true">
        <div class="changepass-card">
            <div class="changepass-header">
                <div class="changepass-header-icon">
                    <i class="ph-bold ph-shield-check"></i>
                </div>
                <div class="changepass-header-text">
                    <h2><span data-i18n="interface.change_account_password"></span></h2>
                    <p><span data-i18n="interface.update_your_account_password"></span></p>
                </div>
                <button type="button" class="changepass-close-btn" id="changepass-close" aria-label="" data-i18n-aria="interface.close">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>
            <form id="changepass-form" class="changepass-form">
                <div class="changepass-form-group">
                    <label for="cp-old-pass"><i class="ph-bold ph-lock-key"></i><span data-i18n="interface.current_password"></span></label>
                    <div class="changepass-input-wrapper">
                        <input type="password" id="cp-old-pass" placeholder="" data-i18n-placeholder="interface.enter_your_current_password" autocomplete="current-password" required>
                        <button type="button" class="cp-toggle-pass" data-target="cp-old-pass" tabindex="-1"><i class="ph-bold ph-eye"></i></button>
                    </div>
                </div>
                <div class="changepass-form-group">
                    <label for="cp-new-pass"><i class="ph-bold ph-lock"></i><span data-i18n="interface.new_password"></span></label>
                    <div class="changepass-input-wrapper">
                        <input type="password" id="cp-new-pass" placeholder="" data-i18n-placeholder="interface.at_least_6_characters" autocomplete="new-password" required>
                        <button type="button" class="cp-toggle-pass" data-target="cp-new-pass" tabindex="-1"><i class="ph-bold ph-eye"></i></button>
                    </div>
                </div>
                <div class="changepass-form-group">
                    <label for="cp-confirm-pass"><i class="ph-bold ph-check-circle"></i><span data-i18n="interface.confirm_new_password"></span></label>
                    <div class="changepass-input-wrapper">
                        <input type="password" id="cp-confirm-pass" placeholder="" data-i18n-placeholder="interface.enter_your_new_password_again" autocomplete="new-password" required>
                        <button type="button" class="cp-toggle-pass" data-target="cp-confirm-pass" tabindex="-1"><i class="ph-bold ph-eye"></i></button>
                    </div>
                </div>
                <div class="changepass-feedback hidden" id="cp-feedback"></div>
                <div class="changepass-actions">
                    <button type="button" class="changepass-btn changepass-btn--cancel" id="changepass-cancel"><span data-i18n="interface.cancel_esc"></span></button>
                    <button type="submit" class="changepass-btn changepass-btn--submit" id="changepass-submit">
                        <span class="cp-btn-text"><span data-i18n="interface.save_password"></span></span>
                        <i class="ph-bold ph-arrow-right"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/i18n.generated.js?v=1"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/asset-public.js?v=2"></script>
    <script src="js/asset-preview.js?v=2"></script>
    <script src="js/module-loader.js?v=14"></script>
    <script src="js/hotbar.js?v=8"></script>
    <script src="js/player_interaction.js?v=8"></script>
    <script src="js/fnc.js?v=2"></script>
    <script src="js/drugs.js?v=3"></script>
    <script src="js/lockpick.js?v=2"></script>
    <script src="js/changepass.js?v=1"></script>
    <script src="js/app.js?v=8"></script>
</body>
</html>
