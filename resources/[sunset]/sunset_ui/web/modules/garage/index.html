<div id="garage" class="hidden">
    <div id="vmenu-wrapper">
        <div class="sidebar">
            <div class="header">
                <h1 data-i18n="ui.garage.personal_vehicles">Vehicule Personale</h1>
                <p id="ui-count">0 Vehicule</p>
            </div>
            <div class="list-container" id="ui-list"></div>
        </div>

        <div class="content">
            <div id="no-selection" data-i18n="ui.garage.select_vehicle">Selecteaza un vehicul</div>
            
            <div id="details-panel" style="display: none;">
                <div class="detail-top">
                    <div class="detail-plate" id="det-plate">PLATE</div>
                    <h2 class="detail-model" id="det-model">MODEL</h2>
                    <div class="detail-status">
                        <div class="dot" id="det-status-dot"></div>
                        <span id="det-status-text">STATUS</span>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-row">
                        <div class="stat-labels"><span data-i18n="menu.vehicle.engine">Motor</span> <span id="det-eng-val">100%</span></div>
                        <div class="bar-bg"><div class="bar-fill" id="det-eng-bar" style="width: 100%;"></div></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-labels"><span data-i18n="menu.vehicle.fuel">Combustibil</span> <span id="det-fuel-val">100%</span></div>
                        <div class="bar-bg"><div class="bar-fill" id="det-fuel-bar" style="width: 100%;"></div></div>
                    </div>
                </div>

                <div class="actions" id="det-actions">
                    <button type="button" class="btn primary" id="btn-spawn" data-i18n="ui.garage.retrieve">Scoate Vehicul</button>
                    <button type="button" class="btn" id="btn-gps" data-i18n="ui.garage.set_gps">Seteaza GPS</button>
                </div>
            </div>
        </div>
        <button type="button" class="vmenu-close-x" id="garage-close" aria-label="Close">×</button>
    </div>
</div>

    <!-- FLEET GARAGE — compact peek panel (robbery fence style) -->
    <div id="fleet-garage" class="fleet-garage hidden">
        <div class="fleet-garage__panel">
            <header class="fleet-garage__head">
                <span id="fleet-garage-title"><span data-i18n="ui.garage.fleet_garage"></span></span>
                <p class="fleet-garage__hint"><span data-i18n="ui.garage.choose_a_unit_you_exit_the_motor_pool_in"></span></p>
            </header>
            <ul id="fleet-garage-list" class="fleet-garage__list menu-vehicle-grid"></ul>
            <button type="button" class="fleet-garage__leave" id="fleet-garage-close"><span data-i18n="common.close"></span></button>
        </div>
    </div>
