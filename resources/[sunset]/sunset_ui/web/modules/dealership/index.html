<div id="dealership" class="dealership-forza hidden" aria-hidden="true">
        <div class="dl-vignette"></div>
        <button type="button" class="dl-admin-toggle hidden" id="dl-admin-toggle"><span data-i18n="ui.dealership.admin_panel"></span></button>

        <div class="dl-ui-layer">
            <div class="dl-catalog-col">
                <div class="dl-section-title" id="dl-category-title"><span data-i18n="ui.dealership.catalog"></span></div>
                <div class="dl-item-list" id="dl-vehicle-list"></div>
            </div>

            <div class="dl-stats-panel">
                <div class="dl-section-title dl-section-title--compact"><span data-i18n="ui.dealership.stock_performance"></span></div>

                <div class="dl-stat-row">
                    <div class="dl-stat-header"><span><span data-i18n="ui.dealership.top_speed"></span></span><span class="dl-stat-val" id="dl-stat-speed-val">—</span></div>
                    <div class="dl-stat-track" id="dl-stat-speed"></div>
                </div>
                <div class="dl-stat-row">
                    <div class="dl-stat-header"><span><span data-i18n="ui.dealership.acceleration"></span></span><span class="dl-stat-val" id="dl-stat-accel-val">—</span></div>
                    <div class="dl-stat-track" id="dl-stat-accel"></div>
                </div>
                <div class="dl-stat-row">
                    <div class="dl-stat-header"><span><span data-i18n="ui.dealership.handling"></span></span><span class="dl-stat-val" id="dl-stat-handling-val">—</span></div>
                    <div class="dl-stat-track" id="dl-stat-handling"></div>
                </div>

                <p class="dl-stock-note" id="dl-stock-note" aria-hidden="true"></p>
                <div class="dl-balance" id="dl-balance" aria-hidden="true"></div>

                <div class="dl-price-display">
                    <span class="dl-price-label" id="dl-price-label"><span data-i18n="ui.dealership.purchase_price"></span></span>
                    <span class="dl-price-value" id="dl-price">—</span>
                </div>

                <button type="button" class="dl-btn-hold" id="dl-btn-buy">
                    <div class="dl-btn-progress" id="dl-buy-progress"></div>
                    <div class="dl-btn-text" id="dl-buy-text"><span class="dl-key-hint"><span data-i18n="ui.dealership.enter"></span></span> <span data-i18n="ui.dealership.hold_to_purchase"></span></div>
                </button>
            </div>
        </div>

        <div class="dl-bottom-tools">
            <div class="dl-color-row" id="dl-color-row">
                <label for="dl-color"><span data-i18n="ui.dealership.paint"></span></label>
                <select id="dl-color">
                    <option value="0" data-i18n="ui.dealership.black"></option>
                    <option value="111" data-i18n="ui.dealership.white"></option>
                    <option value="27" data-i18n="ui.dealership.red"></option>
                    <option value="64" data-i18n="ui.dealership.blue"></option>
                    <option value="53" data-i18n="ui.dealership.green"></option>
                    <option value="88" data-i18n="ui.dealership.yellow"></option>
                    <option value="38" data-i18n="ui.dealership.orange"></option>
                    <option value="147" data-i18n="ui.dealership.carbon"></option>
                </select>
            </div>
            <button type="button" class="dl-btn-test" id="dl-btn-test"><span data-i18n="ui.dealership.test_drive"></span></button>
            <button type="button" class="dl-btn-test" id="dl-btn-rent"><span data-i18n="ui.dealership.rent_ride">Rent a ride</span></button>
            <div class="dl-preview-controls">
                <button type="button" id="dealership-rotate-left" title="" data-i18n-title="ui.dealership.rotate_left">◀</button>
                <span><span data-i18n="ui.dealership.rotate"></span></span>
                <button type="button" id="dealership-rotate-right" title="" data-i18n-title="ui.dealership.rotate_right">▶</button>
            </div>
        </div>
        <p class="dl-close-hint"><span data-i18n="ui.dealership.press_esc_to_close"></span></p>

        <section class="dl-admin-panel hidden" id="dl-admin-panel">
            <div class="dl-admin-head">
                <strong><span data-i18n="ui.dealership.dealership_admin"></span></strong>
                <button type="button" id="dealership-admin-new"><span data-i18n="ui.dealership.new_vehicle"></span></button>
            </div>
            <div class="dl-admin-grid">
                <label><span data-i18n="ui.dealership.spawn_model"></span><input id="dealer-model" maxlength="64" placeholder="" data-i18n-placeholder="ui.dealership.sultan"></label>
                <label><span data-i18n="ui.dealership.display_name"></span><input id="dealer-label" maxlength="80" placeholder="" data-i18n-placeholder="ui.dealership.sultan_fb10bb"></label>
                <label><span data-i18n="ui.dealership.brand"></span><input id="dealer-brand" maxlength="48" placeholder="" data-i18n-placeholder="ui.dealership.karin"></label>
                <label><span data-i18n="ui.dealership.category"></span><input id="dealer-category" maxlength="32" placeholder="" data-i18n-placeholder="ui.dealership.sport"></label>
                <label><span data-i18n="common.price"></span><input id="dealer-price" type="number" min="1" max="2000000000"></label>
                <label><span data-i18n="ui.dealership.stock"></span><input id="dealer-stock" type="number" min="0" max="1000000"></label>
                <label><span data-i18n="ui.dealership.order"></span><input id="dealer-order" type="number" min="0" max="9999"></label>
            </div>
            <div class="dl-admin-checks">
                <label><input id="dealer-available" type="checkbox"> <span data-i18n="ui.dealership.available_for_sale"></span></label>
                <label><input id="dealer-testdrive" type="checkbox"> <span data-i18n="ui.dealership.test_drive_enabled"></span></label>
            </div>
            <div class="dl-admin-actions">
                <button type="button" id="dealership-admin-save"><span data-i18n="ui.dealership.save_add"></span></button>
                <button type="button" id="dealership-admin-delete" class="danger"><span data-i18n="ui.dealership.delete_selected"></span></button>
            </div>
        </section>
    </div>
