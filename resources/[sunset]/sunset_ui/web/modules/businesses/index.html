                </nav>
                <button type="button" class="premium-clan__close" id="business-panel-close"><span data-i18n="ui.businesses.close"></span></button>
            </aside>
            <div class="premium-clan__content">
                <div class="premium-clan__tab is-active" data-business-panel="admin">
                    <div class="premium-clan__header">
                        <h2><span data-i18n="ui.businesses.business_administration"></span></h2>
                        <p><span data-i18n="ui.businesses.set_price_owner_profit_availability_and_owner_for_each"></span></p>
                    </div>
                    <div class="business-admin-layout">
                        <div class="business-admin-list-wrap">
                            <h3><span data-i18n="ui.businesses.locations"></span></h3>
                            <div id="business-admin-list" class="premium-clan__roster business-admin-list"></div>
                        </div>
                        <div class="business-admin-detail-wrap">
                            <p id="business-admin-empty" class="premium-clan__empty"><span data-i18n="ui.businesses.select_a_location_from_the_list"></span></p>
                            <div id="business-admin-form" class="premium-clan__form hidden" data-business-id="">
                                <h3 id="business-admin-selected-label"><span data-i18n="ui.businesses.business_d6663d"></span></h3>
                                <div class="premium-clan__stats business-admin-stats">
                                    <div class="premium-clan__stat"><span class="premium-clan__stat-label"><span data-i18n="ui.businesses.type"></span></span><span class="premium-clan__stat-value" id="business-admin-type">—</span></div>

                                <label><span data-i18n="ui.businesses.purchase_price"></span><input type="number" id="business-admin-price" min="0" step="1000"></label>
                                <label><span data-i18n="ui.businesses.owner_profit"></span><input type="number" id="business-admin-profit" min="0" max="100" step="1"></label>
                                <label class="premium-clan__check"><input type="checkbox" id="business-admin-for-sale"> <span data-i18n="ui.businesses.for_sale_no_owner"></span></label>
                                <label class="premium-clan__check"><input type="checkbox" id="business-admin-enabled" checked> <span data-i18n="ui.businesses.enabled"></span></label>
                                <div class="business-admin-actions premium-clan__btn-group">
                                    <button type="button" class="premium-clan__btn premium-clan__btn--primary" id="business-admin-save"><span data-i18n="ui.businesses.save"></span></button>
                                    <button type="button" class="premium-clan__btn premium-clan__btn--secondary" id="business-admin-teleport"><span data-i18n="ui.businesses.teleport"></span></button>
                                    <button type="button" class="premium-clan__btn premium-clan__btn--danger" id="business-admin-clear-owner"><span data-i18n="ui.businesses.clear_owner"></span></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="premium-clan__tab" data-business-panel="owner">
                    <div class="premium-clan__header">

                    </div>
                    <div class="premium-clan__stat business-owner-total-stat">
                        <span class="premium-clan__stat-label"><span data-i18n="ui.businesses.total_available"></span></span>
                        <span class="premium-clan__stat-value" id="business-owner-total" style="color:var(--pf-success);">$0</span>
                    </div>
                    <div id="business-owner-list" class="business-owner-list"></div>
                </div>
            </div>
            <div class="premium-clans-dir__close-hint"><span data-i18n="ui.businesses.press_esc_to_close"></span></div>
        </div>
