<div id="racing-overlay" class="racing-overlay hidden" aria-hidden="true">
        <div class="racing-panel">
            <div class="racing-header">
                <div class="racing-header__logo">🏁</div>
                <div>
                    <div class="racing-header__title"><span data-i18n="ui.racing.street_racing"></span></div>
                    <div class="racing-header__sub"><span data-i18n="ui.racing.checkpoint_races_entry_fee_winner_takes_the_pot"></span></div>
                </div>
                <button type="button" class="racing-header__close" id="racing-close" title="" data-i18n-title="ui.racing.close_esc">✕</button>
            </div>
            <div class="racing-body" id="racing-body"></div>
            <div class="racing-actions">
                <button type="button" class="racing-btn" id="racing-solo" disabled><span data-i18n="ui.racing.start_solo"></span></button>
                <button type="button" class="racing-btn racing-btn--secondary" id="racing-join" disabled><span data-i18n="ui.racing.join_multiplayer"></span></button>
                <button type="button" class="racing-btn hidden" id="racing-start-multi"><span data-i18n="ui.racing.start_race"></span></button>
                <button type="button" class="racing-btn racing-btn--secondary hidden" id="racing-leave"><span data-i18n="ui.racing.leave_lobby"></span></button>
            </div>
        </div>
    </div>
