<div id="trucker-laptop" class="store-forza hidden" aria-hidden="true">
        <div class="st-vignette"></div>
        <button type="button" id="trucker-close" class="st-close-btn" title="" aria-label="" data-i18n-title="common.close" data-i18n-aria="ui.trucker.close_route_laptop">
            <i class="ph-bold ph-x"></i>
        </button>
        <div class="st-ui-layer">
            <div class="st-categories-panel">
                <div class="st-section-title"><span data-i18n="ui.trucker.delivery_categories"></span></div>
                <div class="st-cat-list" id="tl-cat-list"></div>
            </div>
            <div class="tl-routes-panel">
                <div class="st-section-title">
                    <span data-i18n="ui.trucker.available_routes"></span>
                    <span id="tl-rank-badge" class="tl-rank-badge"><span data-i18n="ui.trucker.rank_1"></span></span>
                </div>
                <div class="tl-xp-bar-wrap">
                    <div class="tl-xp-bar-label"><span id="tl-xp-label"><span data-i18n="ui.trucker.0_100_xp"></span></span></div>
                    <div class="tl-xp-bar-track"><div class="tl-xp-bar-fill" id="tl-xp-fill" style="width:0%"></div></div>
                </div>
                <div id="tl-route-list" class="tl-route-list"></div>
                <button type="button" id="tl-accept-btn" class="st-btn-hold" disabled>
                    <div class="st-btn-text"><span data-i18n="ui.trucker.select_a_route"></span></div>
                </button>
            </div>
        </div>
        <div class="st-close-hint"><span data-i18n="ui.trucker.press_esc_to_close"></span></div>
    </div>
