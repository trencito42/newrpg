<div id="appearance-studio" class="appearance-studio hidden">
        <div class="studio-vignette"></div>
        <div class="studio-preview-hud">
            <span class="studio-preview-label"><span data-i18n="ui.studio.live_preview"></span></span>
            <span class="studio-preview-keys"><span data-i18n="ui.studio.a_d_or_to_rotate"></span></span>
        </div>
        <aside class="studio-sidebar">
            <img class="studio-logo" src="assets/logoblaze.svg?v=1" width="88" height="88" alt="" data-i18n-alt="ui.studio.blaze_mp">
            <h2 class="studio-title"><span data-i18n="ui.studio.character_look"></span></h2>
            <p class="studio-hint"><span data-i18n="ui.studio.rotate_with_a_d_or_the_rotate_buttons_camera"></span></p>
            <div class="studio-gender" id="appearance-gender">
                <button type="button" class="studio-gender__btn is-active" data-gender="0"><span data-i18n="ui.studio.male"></span></button>
                <button type="button" class="studio-gender__btn" data-gender="1"><span data-i18n="ui.studio.female"></span></button>
            </div>
            <div class="studio-controls" id="appearance-sliders"></div>
            <div class="studio-rotate">
                <button type="button" id="appearance-cam-full" class="is-active"><span data-i18n="ui.studio.full"></span></button>
                <button type="button" id="appearance-cam-face"><span data-i18n="ui.studio.face"></span></button>
                <button type="button" id="appearance-cam-feet"><span data-i18n="ui.studio.shoes"></span></button>
            </div>
            <div class="studio-rotate">
                <button type="button" id="appearance-rot-left"><span data-i18n="ui.studio.rotate"></span></button>
                <button type="button" id="appearance-rot-right"><span data-i18n="ui.studio.rotate_ea46f1"></span></button>
            </div>
            <button type="button" class="studio-save" id="appearance-save"><span data-i18n="ui.studio.confirm_play"></span></button>
        </aside>
    </div>
