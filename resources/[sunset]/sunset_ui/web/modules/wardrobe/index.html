<div id="clothing" class="overlay-panel hidden">
        <div class="overlay-panel__box">
            <h2 id="clothing-title"><span data-i18n="ui.wardrobe.clothing"></span></h2>
            <p id="clothing-hint" style="color:#aaa;font-size:13px"><span data-i18n="ui.wardrobe.50_per_change"></span></p>
            <div id="clothing-options" class="clothing-options"></div>
            <button type="button" class="panel-close" id="clothing-close"><span data-i18n="common.close"></span></button>
        </div>
    </div>

    <!-- WARDROBE (Forza clothing store) -->
    <div id="wardrobe" class="wardrobe-forza hidden" aria-hidden="true">
        <div class="wr-vignette"></div>
        <div class="wr-ui-layer">
            <div class="wr-categories-panel">
                <div class="wr-section-title"><span data-i18n="ui.wardrobe.wardrobe"></span></div>
                <div class="wr-cat-list" id="wardrobe-cat-list"></div>
            </div>
            <div class="wr-selection-panel">
                <div>
                    <div class="wr-section-title" style="margin-bottom:10px;color:var(--wr-text-muted);"><span data-i18n="ui.wardrobe.current_category"></span></div>
                    <div class="wr-active-cat-name" id="wardrobe-active-cat"><span data-i18n="ui.wardrobe.shirt_jacket"></span></div>
                </div>
                <div class="wr-slider-group">
                    <div class="wr-slider-header"><span><span data-i18n="ui.wardrobe.item_model"></span></span><span style="color:var(--wr-accent);"><span data-i18n="ui.wardrobe.item_id"></span></span></div>
                    <div class="wr-slider-controls">
                        <button type="button" class="wr-slider-btn" id="wardrobe-model-dec"><i class="ph-bold ph-caret-left"></i></button>
                        <div class="wr-slider-value">
                            <span id="wardrobe-val-model">0</span>
                            <span class="wr-slider-max">/ <span id="wardrobe-max-model">0</span></span>
                        </div>
                        <button type="button" class="wr-slider-btn" id="wardrobe-model-inc"><i class="ph-bold ph-caret-right"></i></button>
                    </div>
                    <div class="wr-slider-track"><div class="wr-slider-fill" id="wardrobe-track-model"></div></div>
                </div>
                <div class="wr-slider-group">
                    <div class="wr-slider-header"><span><span data-i18n="ui.wardrobe.color_variant"></span></span><span style="color:var(--wr-accent);"><span data-i18n="ui.wardrobe.texture"></span></span></div>
                    <div class="wr-slider-controls">
                        <button type="button" class="wr-slider-btn" id="wardrobe-texture-dec"><i class="ph-bold ph-caret-left"></i></button>
                        <div class="wr-slider-value">
                            <span id="wardrobe-val-texture">0</span>
                            <span class="wr-slider-max">/ <span id="wardrobe-max-texture">0</span></span>
                        </div>
                        <button type="button" class="wr-slider-btn" id="wardrobe-texture-inc"><i class="ph-bold ph-caret-right"></i></button>
                    </div>
                    <div class="wr-slider-track"><div class="wr-slider-fill" id="wardrobe-track-texture"></div></div>
                </div>
                <div class="wr-cart-summary">
                    <span class="wr-price-label"><span data-i18n="ui.wardrobe.cart_total"></span></span>
                    <span class="wr-price-value" id="wardrobe-cart-price">$50</span>
                    <button type="button" class="wr-btn-hold" id="wardrobe-buy" disabled>
                        <div class="wr-btn-progress" id="wardrobe-buy-progress"></div>
                        <div class="wr-btn-text" id="wardrobe-buy-text">
                            <span class="wr-key-hint"><span data-i18n="ui.wardrobe.enter"></span></span> <span data-i18n="ui.wardrobe.pay"></span>
                        </div>
                    </button>
                </div>
            </div>
        </div>
        <div class="wr-cam-controls">
            <div class="wr-cam-btn"><div class="wr-key"><span data-i18n="ui.wardrobe.q"></span></div> / <div class="wr-key"><span data-i18n="ui.wardrobe.e"></span></div> <span data-i18n="ui.wardrobe.rotate"></span></div>
            <div class="wr-cam-btn"><div class="wr-key"><span data-i18n="ui.wardrobe.scroll"></span></div> <span data-i18n="ui.wardrobe.zoom"></span></div>
            <div class="wr-cam-btn"><div class="wr-key"><span data-i18n="ui.wardrobe.esc"></span></div> <span data-i18n="common.close"></span></div>
        </div>
        <div class="wr-close-hint"><span data-i18n="ui.wardrobe.press_esc_to_close"></span></div>
    </div>
