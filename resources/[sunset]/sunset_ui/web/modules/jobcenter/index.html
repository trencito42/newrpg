<div id="jobcenter" class="menu menu--solo menu--solo-inventory hidden">
    <div class="premium-inventory-shell">
        <section class="premium-inventory-main">
            <header class="premium-inventory-header">
                <h1 id="jobcenter-title"><span data-i18n="ui.jobcenter.employment_office"></span></h1>
            </header>
            <div class="premium-nearby-list jobcenter-job-list" id="jobcenter-list"></div>
        </section>
        <aside class="premium-inventory-side">
            <div class="premium-side-heading"><h2 id="jobcenter-side-title"><span data-i18n="ui.jobcenter.career_opportunity"></span></h2></div>
            <div class="jobcenter-details" id="jobcenter-details">
                <p class="jobcenter-details__hint"><span data-i18n="ui.jobcenter.select_a_career_opportunity_from_the_list"></span></p>
            </div>
            <div class="jobcenter-footer">
                <button type="button" class="jobcenter-waypoint-btn hidden" id="jobcenter-waypoint"><span data-i18n="ui.jobcenter.set_gps_to_workplace"></span></button>
                <button type="button" class="fishing-shop-confirm-btn hidden" id="jobcenter-hire" disabled><span data-i18n="ui.jobcenter.apply_in_person"></span></button>
            </div>
        </aside>
        <div class="premium-close-hint"><span data-i18n="ui.jobcenter.press_esc_to_close"></span></div>
    </div>
</div>
