<div id="phone-device" class="phone-device hidden" aria-hidden="true">
    <div class="phone-hardware">
        <div class="phone-screen">
            <div class="status-bar" id="phone-status">
                <div class="sb-left" id="phone-clock">00:00</div>
                <div class="sb-right" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M2 22h20V2z"></path></svg>
                    <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"></path></svg>
                </div>
            </div>
            <button type="button" class="dynamic-island" id="phone-island">
                <span class="di-call-info">
                    <span class="di-wave" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span class="di-caller" id="phone-island-name"></span>
                    <span class="di-mute" id="phone-island-mute" hidden></span>
                    <span class="di-timer" id="phone-island-time">00:00</span>
                </span>
            </button>
            <div id="phone-views"></div>
            <button type="button" class="home-indicator" id="phone-home-bar"></button>
            <div class="phone-toast" id="phone-toast" hidden></div>
            <div class="call-layer" id="phone-call-layer" hidden></div>
        </div>
    </div>
    <div id="phone-camera-hud" class="phone-camera-hud" hidden>
        <div class="phone-camera-top">
            <button type="button" id="phone-camera-close" class="phone-camera-icon-btn" data-camera-ui="1" aria-label="" data-i18n-aria="phone.ui.close"></button>
            <span id="phone-camera-status" class="phone-camera-status" hidden></span>
            <button type="button" id="phone-camera-flip" class="phone-camera-icon-btn" data-camera-ui="1" aria-label="" data-i18n-aria="phone.ui.camera_flip_lens"></button>
        </div>
        <div id="phone-camera-stage" class="phone-camera-stage" aria-label="" data-i18n-aria="phone.ui.camera_preview"></div>
        <div class="phone-camera-flash" id="phone-camera-flash" aria-hidden="true"></div>
        <div class="phone-camera-bottom" data-camera-ui="1">
            <div class="phone-camera-lenses" id="phone-camera-lenses" role="group" aria-label="" data-i18n-aria="phone.ui.camera_lens_group">
                <button type="button" class="phone-camera-lens" data-lens="0.5">0.5×</button>
                <button type="button" class="phone-camera-lens is-active" data-lens="1">1×</button>
                <button type="button" class="phone-camera-lens" data-lens="2">2×</button>
            </div>
            <div class="phone-camera-bar">
                <button type="button" id="phone-camera-roll" class="phone-camera-roll" data-camera-ui="1" aria-label="" data-i18n-aria="phone.ui.gallery"></button>
                <button type="button" id="phone-camera-shutter" class="phone-shutter" data-camera-ui="1" aria-label="" data-i18n-aria="phone.ui.camera_shutter"></button>
                <span class="phone-camera-bar-spacer" aria-hidden="true"></span>
            </div>
        </div>
    </div>
</div>
