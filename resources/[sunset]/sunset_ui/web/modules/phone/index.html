<div id="phone-device" class="phone-device hidden" aria-hidden="true">
    <div class="phone-hardware">
        <div class="phone-screen">
            <div class="status-bar" id="phone-status">
                <div class="sb-left" id="phone-clock">00:00</div>
                <div class="sb-right" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M2 22h20V2z"></path></svg>
                    <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"></path></svg>
                </div>
            </div>
            <button type="button" class="dynamic-island" id="phone-island">
                <span class="di-call-info">
                    <span class="di-wave" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span class="di-caller" id="phone-island-name"></span>
                    <span class="di-timer" id="phone-island-time">00:00</span>
                </span>
            </button>
            <div id="phone-views"></div>
            <button type="button" class="home-indicator" id="phone-home-bar"></button>
            <div class="phone-toast" id="phone-toast" hidden></div>
            <div class="call-layer" id="phone-call-layer" hidden></div>
        </div>
    </div>
</div>
