<div id="player-interaction" class="player-interaction hidden" aria-hidden="true">
        <div class="pi-world-target hidden" id="pi-world-target">
            <div class="pi-target-name" id="pi-target-name"><span data-i18n="ui.player_interaction.player"></span></div>
            <div class="pi-target-action">
                <span><span data-i18n="ui.player_interaction.hold"></span></span>
                <div class="pi-key-circle-wrapper">
                    <span class="pi-key-letter" id="pi-key-letter"><span data-i18n="ui.player_interaction.g"></span></span>
                    <svg class="pi-key-svg" viewBox="0 0 36 36" aria-hidden="true">
                        <circle class="pi-circle-track" cx="18" cy="18" r="16"></circle>
                        <circle class="pi-circle-progress" id="pi-progress-ring" cx="18" cy="18" r="16"></circle>
                    </svg>
                </div>
                <span><span data-i18n="ui.player_interaction.to_interact"></span></span>
            </div>
        </div>

        <div class="pi-screen-menu" id="pi-screen-menu">
            <div class="pi-menu-title" id="pi-menu-title"><span data-i18n="ui.player_interaction.actiuni_jucator"></span></div>
            <div class="pi-menu-items" id="pi-menu-items"></div>
            <div class="pi-input-panel hidden" id="pi-input-panel">
                <div class="pi-input-panel__label" id="pi-input-label"></div>
                <div class="pi-input-panel__row">
                    <input type="text" class="pi-input-panel__field" id="pi-input-field" autocomplete="off">
                    <button type="button" class="pi-input-panel__submit" id="pi-input-submit"><span data-i18n="common.ok"></span></button>
                </div>
            </div>
        </div>
    </div>
