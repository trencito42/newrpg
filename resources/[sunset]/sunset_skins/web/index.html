<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skin Shop</title>
  <link rel="stylesheet" href="css/skins.css"/>
</head>
<body>
  <div id="overlay" class="hidden">
    <div id="panel">
      <div id="header">
        <span id="title">Skin Shop</span>
        <button id="closeBtn">✕</button>
      </div>
      <div id="filters">
        <button class="filter-btn active" data-cat="all">All</button>
        <button class="filter-btn" data-cat="civilian">Civilian</button>
        <button class="filter-btn" data-cat="special">Special</button>
        <button class="filter-btn" data-cat="premium">Premium</button>
        <button class="filter-btn" data-cat="exclusive">Exclusive</button>
      </div>
      <div id="grid"></div>
    </div>
  </div>
  <script src="js/skins.js"></script>
</body>
</html>
