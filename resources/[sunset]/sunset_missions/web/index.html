<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="ui.missions.sunset_missions">Sunset Missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,700;1,700&family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/missions.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     MISSION OFFER  — right-side panel (matches playerInteraction)
═══════════════════════════════════════════════════════ -->
<div id="mission-offer" class="ms-offer-root hidden">
    <div class="ms-offer-panel">
        <div class="ms-panel-title" id="offer-contact-label"><span data-i18n="ui.missions.mission_offer">MISSION OFFER</span></div>

        <div class="ms-panel-items">
            <!-- Logo -->
            <img id="offer-logo" class="ms-offer-logo hidden" src="" alt="">

            <!-- Mission name -->
            <div class="ms-panel-mission-name" id="offer-mission-name"></div>

            <!-- Details group -->
            <div class="ms-panel-details" id="offer-details">
                <div class="ms-panel-detail" id="offer-area-row">
                    <span class="ms-detail-key"><span data-i18n="ui.missions.area">AREA</span></span>
                    <span class="ms-detail-val" id="offer-area"></span>
                </div>
                <div class="ms-panel-detail">
                    <span class="ms-detail-key"><span data-i18n="ui.missions.payout">PAYOUT</span></span>
                    <span class="ms-detail-val ms-detail-money" id="offer-payout"></span>
                </div>
                <div class="ms-panel-detail" id="offer-rep-row">
                    <span class="ms-detail-key"><span data-i18n="ui.missions.rep">REP</span></span>
                    <span class="ms-detail-val" id="offer-rep"></span>
                </div>
                <div class="ms-panel-detail ms-detail-warn hidden" id="offer-cooldown-row">
                    <span class="ms-detail-key"><span data-i18n="ui.missions.cooldown">COOLDOWN</span></span>
                    <span class="ms-detail-val" id="offer-cooldown"></span>
                </div>
            </div>

            <!-- Actions -->
            <button class="ms-panel-item ms-item-accept" id="btn-accept"><span data-i18n="ui.missions.accept">ACCEPT</span></button>
            <button class="ms-panel-item ms-item-danger" id="btn-decline"><span data-i18n="ui.missions.decline">DECLINE</span></button>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════
     OBJECTIVE HUD  — top-right strip
═══════════════════════════════════════════════════════ -->
<div id="mission-hud" class="ms-hud hidden">
    <div class="ms-hud-label"><span data-i18n="ui.missions.active_mission">ACTIVE MISSION</span></div>
    <div class="ms-hud-objective" id="hud-objective"></div>
    <div class="ms-hud-sub" id="hud-sub"></div>
    <div class="ms-hud-extras" id="hud-extras"></div>
</div>

<!-- ══════════════════════════════════════════════════════
     LOCKPICK MINIGAME
═══════════════════════════════════════════════════════ -->
<div id="lockpick" class="ms-mg-root hidden">
    <div class="lp-skyrim-panel" id="ms-lp-panel">
        <div class="ms-lp-header">
            <div class="ms-lp-title-wrap">
                <h2 class="ms-lp-title"><span data-i18n="ui.missions.pick_the_lock">SPARGERE CONTACT</span></h2>
                <div class="ms-lp-subtitle"><span data-i18n="interface.vehicle_security_system"></span></div>
            </div>
            <div class="ms-lp-instruction">
                <span class="ms-keybind">A</span> / <span class="ms-keybind">D</span><span data-i18n="interface.rotate_hold"></span><span class="ms-keybind">SPACE</span><span data-i18n="interface.force"></span></div>
        </div>
        <div class="ms-lp-body">
            <div class="ms-lp-side">
                <div class="ms-stat-box">
                    <div class="ms-stat-label"><span data-i18n="interface.lockpick_condition"></span></div>
                    <div class="ms-hp-bg"><div class="ms-hp-fill" id="ms-lp-hp-fill"></div></div>
                    <div class="ms-hp-val" id="ms-lp-hp-text">100%</div>
                </div>
                <div style="flex:1;"></div>
                <div class="ms-stat-box">
                    <div class="ms-stat-label"><span data-i18n="interface.pins_unlocked"></span></div>
                    <div class="ms-pins-wrap">
                        <div class="ms-pin-dot" id="ms-pin-1"></div>
                        <div class="ms-pin-dot" id="ms-pin-2"></div>
                        <div class="ms-pin-dot" id="ms-pin-3"></div>
                    </div>
                </div>
            </div>
            <div class="ms-lp-visual">
                <svg viewBox="0 0 200 200" id="ms-lp-svg">
                    <circle class="ms-track-bg" cx="100" cy="100" r="70"></circle>
                    <line x1="100" y1="20" x2="100" y2="35" stroke="rgba(242, 239, 232, 0.2)" stroke-width="4" stroke-linecap="round"></line>
                    <g id="ms-lp-cylinder" transform="rotate(0 100 100)">
                        <circle class="ms-center-hub" cx="100" cy="100" r="45"></circle>
                        <rect x="96" y="70" width="8" height="60" fill="#08080a" rx="2"></rect>
                        <circle cx="100" cy="100" r="8" fill="#08080a"></circle>
                        <g id="ms-lp-cursor" transform="rotate(0 100 100)">
                            <line class="ms-cursor-glow" x1="100" y1="100" x2="100" y2="10"></line>
                            <line class="ms-cursor-line" x1="100" y1="100" x2="100" y2="10"></line>
                        </g>
                    </g>
                </svg>
                <div class="ms-lp-overlay" id="ms-lp-overlay">
                    <div class="ms-lp-o-title" id="ms-lp-o-title"><span data-i18n="interface.result"></span></div>
                    <div class="ms-lp-o-sub" id="ms-lp-o-sub"><span data-i18n="interface.message"></span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════
     SEAL MINIGAME
═══════════════════════════════════════════════════════ -->
<div id="seal-game" class="ms-mg-root hidden">
    <div class="ms-mg-card">
        <div class="ms-mg-label"><span data-i18n="ui.missions.cut_the_seal">CUT THE SEAL</span></div>
        <div class="ms-mg-hint"><span data-i18n="ui.missions.hold_steady_keep_pressure_in_the">Hold steady — keep pressure in the</span> <em><span data-i18n="ui.missions.green_zone">green zone</span></em></div>
        <div class="sl-bar-wrap">
            <div class="sl-bar-track">
                <div class="sl-zone-good"></div>
                <div class="sl-indicator" id="sl-indicator"></div>
            </div>
            <div class="sl-progress-wrap">
                <div class="sl-progress" id="sl-progress"></div>
            </div>
        </div>
        <button class="ms-mg-btn" id="btn-seal"
            onmousedown="SealGame.onPress()" onmouseup="SealGame.onRelease()"><span data-i18n="ui.missions.hold">HOLD</span></button>
        <div class="ms-mg-feedback" id="sl-feedback"></div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════
     MISSION COMPLETE
═══════════════════════════════════════════════════════ -->
<div id="mission-complete" class="ms-complete-root hidden">
    <div class="ms-complete-panel">
        <div class="ms-complete-tag"><span data-i18n="ui.missions.mission_complete">MISSION COMPLETE</span></div>
        <div class="ms-complete-mission" id="complete-mission-name"></div>
        <div class="ms-complete-divider"></div>
        <div class="ms-complete-rows" id="complete-rewards"></div>
        <div class="ms-complete-total-row">
            <span><span data-i18n="ui.missions.total_earned">TOTAL EARNED</span></span>
            <span class="ms-complete-total" id="complete-total"></span>
        </div>
        <div class="ms-complete-rep" id="complete-rep"></div>
        <button class="ms-panel-item ms-item-accept ms-complete-close" id="btn-complete"><span data-i18n="ui.missions.continue">CONTINUE</span></button>
    </div>
</div>

<script src="https://cfx-nui-sunset_ui/web/js/i18n.generated.js?v=3"></script>
<script src="https://cfx-nui-sunset_ui/web/js/i18n.js?v=3"></script>
<script src="js/minigames.js?v=3"></script>
<script src="js/missions.js?v=3"></script>
</body>
</html>
