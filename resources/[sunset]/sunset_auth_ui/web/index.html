                    <defs>
                        <clipPath id="auth-clip">
                            <rect width="710" height="159" fill="white" transform="translate(0 0.5)"/>

                </svg>
            </div>

            <div class="auth-form-slider" id="auth-form-slider">
                <!-- Login Form -->
                <div class="auth-form is-active" id="auth-form-login">
                    <div class="auth-field">
                        <label for="auth-user" data-i18n="auth.player_name">PLAYER NAME</label>
                        <input type="text" id="auth-user" maxlength="20" autocomplete="username" spellcheck="false" placeholder="ex: RacketPlayer" data-i18n-placeholder="auth.player_name_placeholder">
                    </div>

                    <div class="auth-field">
                        <label for="auth-pass" data-i18n="auth.access_password">PASSWORD</label>
                        <input type="password" id="auth-pass" maxlength="64" autocomplete="current-password" placeholder="••••••••">
                    </div>

                    <button type="button" class="auth-btn" id="auth-login-btn">
                        <span data-i18n="auth.sign_in">SIGN IN</span>
                    </button>

                    <div class="auth-links">
                        <button type="button" class="auth-link" id="auth-go-register" data-i18n="auth.create_link">No account? Create one →</button>
                    </div>
                </div>

                <!-- Register Form -->
                <div class="auth-form hidden" id="auth-form-register">
                    <div class="auth-field">
                        <label for="reg-user" data-i18n="auth.desired_name">USERNAME</label>
                        <input type="text" id="reg-user" maxlength="20" autocomplete="username" spellcheck="false" placeholder="Choose a username" data-i18n-placeholder="auth.choose_username">
                    </div>

                    <div class="auth-field">
                        <label for="reg-email" data-i18n="auth.email_address">EMAIL</label>
                        <input type="email" id="reg-email" maxlength="254" autocomplete="email" spellcheck="false" placeholder="you@example.com" data-i18n-placeholder="auth.email_placeholder">
                    </div>

                    <div class="auth-field">
                        <label for="reg-pass" data-i18n="auth.secure_password">PASSWORD</label>
                        <input type="password" id="reg-pass" maxlength="64" autocomplete="new-password" placeholder="At least 6 characters" data-i18n-placeholder="auth.password_min_placeholder">
                    </div>

                    <div class="auth-field">
                        <label for="reg-pass2" data-i18n="auth.confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="reg-pass2" maxlength="64" autocomplete="new-password" placeholder="Repeat your password" data-i18n-placeholder="auth.repeat_password">
                    </div>

                    <button type="button" class="auth-btn" id="auth-register-btn">
                        <span data-i18n="auth.register">CREATE ACCOUNT</span>
                    </button>

                    <div class="auth-links">
                        <button type="button" class="auth-link" id="auth-go-login" data-i18n="auth.back_to_login">← Back to Sign In</button>
                    </div>
                </div>
            </div>

            <!-- Error Banner -->
            <div class="auth-error hidden" id="auth-error"></div>

            <!-- Footer -->
            <footer class="auth-footer">
                <div class="auth-server-status"><span class="status-dot"></span> <span data-i18n="auth.server_online">Server Online</span></div>
                <div class="auth-version" data-i18n-ignore="product-name">Racket RPG</div>
            </footer>
        </div>

        <!-- Email Link Modal -->
        <div id="auth-email-modal" class="auth-modal-overlay hidden" role="dialog" aria-modal="true">
            <div class="auth-modal-panel">
                <h2 class="auth-modal-title" data-i18n="auth.link_email">Link your email</h2>
                <p class="auth-modal-desc">
                    <span data-i18n="auth.link_email_prefix">We need an email address for account</span>
                    <strong id="auth-email-username">your account</strong>
                    <span data-i18n="auth.link_email_suffix">for security and recovery.</span>
                </p>

                <div class="auth-field">
                    <label for="auth-email-input" data-i18n="auth.email_address">EMAIL</label>
                    <input type="email" id="auth-email-input" maxlength="254" autocomplete="email" spellcheck="false" placeholder="you@example.com" data-i18n-placeholder="auth.email_placeholder">
                </div>

                <div class="auth-error hidden" id="auth-email-error"></div>

                <button type="button" class="auth-btn" id="auth-email-submit" data-i18n="auth.save_continue">SAVE &amp; CONTINUE</button>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="auth-loading-overlay hidden" id="auth-loading">
            <div class="auth-spinner"></div>
            <p id="auth-loading-text" data-i18n="auth.connecting">Connecting…</p>
        </div>
    </div>

    <script src="https://cfx-nui-sunset_ui/web/js/i18n.generated.js?v=3"></script>

    <script src="auth.js?v=8"></script>

</html>
