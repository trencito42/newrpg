<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.page_title">blaze.mp — Authentication</title>
    <link rel="stylesheet" href="auth.css?v=4">
</head>
<body>
    <div id="auth-screen" class="auth-screen" aria-hidden="true">
        <div class="auth-bg"></div>
        <div class="auth-overlay"></div>

        <div id="auth-panel" class="auth-container">
            <header class="auth-header">
                <div class="auth-subtitle" data-i18n="auth.security">SUNSETMP SECURITY</div>
                <h1 class="auth-title" id="auth-main-title" data-i18n="auth.login_title">Sign in</h1>
            </header>

            <div class="auth-form-slider" id="auth-form-slider">
                <!-- Login Form -->
                <div class="auth-form is-active" id="auth-form-login">
                    <div class="auth-field">
                        <label for="auth-user" data-i18n="auth.player_name">PLAYER NAME</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <input type="text" id="auth-user" maxlength="20" autocomplete="username" spellcheck="false" placeholder="Example: Stefan" data-i18n-placeholder="auth.player_name_placeholder">
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="auth-pass" data-i18n="auth.access_password">ACCESS PASSWORD</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <input type="password" id="auth-pass" maxlength="64" autocomplete="current-password" placeholder="••••••••">
                        </div>
                    </div>

                    <label class="auth-check">
                        <input type="checkbox" id="auth-remember" checked>
                        <span class="auth-check-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </span>
                        <span class="auth-check-label" data-i18n="auth.remember">Save this account for Quick Login</span>
                    </label>

                    <button type="button" class="auth-btn auth-btn--primary" id="auth-login-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                        <span data-i18n="auth.sign_in">SIGN IN</span>
                    </button>

                    <div class="auth-links">
                        <button type="button" class="auth-link" id="auth-go-register" data-i18n="auth.create_link">No account? Create one →</button>
                    </div>
                </div>

                <!-- Register Form -->
                <div class="auth-form hidden" id="auth-form-register">
                    <div class="auth-field">
                        <label for="reg-user" data-i18n="auth.desired_name">DESIRED NAME</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <input type="text" id="reg-user" maxlength="20" autocomplete="username" spellcheck="false" placeholder="Choose a username" data-i18n-placeholder="auth.choose_username">
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="reg-email" data-i18n="auth.email_address">EMAIL ADDRESS</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            <input type="email" id="reg-email" maxlength="254" autocomplete="email" spellcheck="false" placeholder="you@example.com" data-i18n-placeholder="auth.email_placeholder">
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="reg-pass" data-i18n="auth.secure_password">SECURE PASSWORD</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <input type="password" id="reg-pass" maxlength="64" autocomplete="new-password" placeholder="At least 6 characters" data-i18n-placeholder="auth.password_min_placeholder">
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="reg-pass2" data-i18n="auth.confirm_password">CONFIRM PASSWORD</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                            <input type="password" id="reg-pass2" maxlength="64" autocomplete="new-password" placeholder="Repeat your password" data-i18n-placeholder="auth.repeat_password">
                        </div>
                    </div>

                    <label class="auth-check">
                        <input type="checkbox" id="reg-remember" checked>
                        <span class="auth-check-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </span>
                        <span class="auth-check-label" data-i18n="auth.remember">Save this account for Quick Login</span>
                    </label>

                    <button type="button" class="auth-btn auth-btn--primary" id="auth-register-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                        <span data-i18n="auth.register">REGISTER</span>
                    </button>

                    <div class="auth-links">
                        <button type="button" class="auth-link" id="auth-go-login" data-i18n="auth.back_to_login">← Back to Sign In</button>
                    </div>
                </div>
            </div>

            <!-- Saved Accounts / Quick Login -->
            <div class="auth-accounts hidden" id="auth-accounts">
                <div class="auth-divider"><span data-i18n="auth.quick_select">QUICK LOGIN — SELECT ACCOUNT</span></div>
                <div class="auth-accounts-list" id="auth-accounts-list"></div>
            </div>

            <!-- Error Banner -->
            <div class="auth-error hidden" id="auth-error"></div>

            <!-- Footer -->
            <footer class="auth-footer">
                <div class="auth-server-status"><span class="status-dot"></span> <span data-i18n="auth.server_online">Server Online</span></div>
                <div class="auth-version" data-i18n-ignore="product-name">blaze.mp · Sunset Core Edition</div>
            </footer>
        </div>

        <!-- Email Link Modal -->
        <div id="auth-email-modal" class="auth-modal-overlay hidden" role="dialog" aria-modal="true">
            <div class="auth-modal-panel">
                <div class="auth-subtitle" data-i18n="auth.account_sync">ACCOUNT SYNC</div>
                <h2 class="auth-modal-title" data-i18n="auth.link_email">Link your email</h2>
                <p class="auth-modal-desc"><span data-i18n="auth.link_email_prefix">We need an email address for account</span> <strong id="auth-email-username">your account</strong> <span data-i18n="auth.link_email_suffix">for security and recovery.</span></p>
                
                <div class="auth-field">
                    <label for="auth-email-input" data-i18n="auth.email_address">EMAIL ADDRESS</label>
                    <div class="auth-input-wrap">
                        <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="auth-email-input" maxlength="254" autocomplete="email" spellcheck="false" placeholder="you@example.com" data-i18n-placeholder="auth.email_placeholder">
                    </div>
                </div>

                <div class="auth-error hidden" id="auth-email-error"></div>

                <button type="button" class="auth-btn auth-btn--primary" id="auth-email-submit" data-i18n="auth.save_continue">SAVE &amp; CONTINUE</button>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="auth-loading-overlay hidden" id="auth-loading">
            <div class="auth-spinner"></div>
            <p id="auth-loading-text" data-i18n="auth.connecting">Connecting…</p>
        </div>
    </div>

    <script src="https://cfx-nui-sunset_ui/web/js/i18n.generated.js?v=3"></script>
    <script src="https://cfx-nui-sunset_ui/web/js/i18n.js?v=3"></script>
    <script src="auth.js?v=7"></script>
</body>
</html>
