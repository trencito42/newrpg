<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="interface.hacking_protocol"></title>
    <script>
        window.prompt = function() { return null; };
        window.alert = function() {};
        window.confirm = function() { return false; };
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="nui://sunset_ui/web/js/resolution-scale.js"></script>
    <!-- [CEF FIX] FiveM Chromium backdrop-filter and OS cursor hiding -->
    <style>
        *, *::before, *::after, html, body, svg, svg * {
            cursor: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
    </style>
</head>
<body>
    <div id="hack-root" class="hack-root hidden">
        <!-- Atmospheric Overlays -->
        <div class="overlay vignette"></div>
        <div class="overlay scanlines"></div>
        <div class="overlay digital-interference"></div>

        <!-- Top Minimalist ctOS Feed Status -->
        <header class="ctos-header">
            <div class="ctos-brand">
                <div class="ctos-indicator">
                    <span class="live-dot"></span>
                    <span class="sys-code" id="hud-sys-code"><span data-i18n="interface.live_surveillance_0x4f8e"></span></span>
                </div>
                <h1 class="ctos-title" id="hud-title"><span data-i18n="interface.ctos_network_grid"></span></h1>
                <div class="ctos-subtitle" id="hud-subtitle"><span data-i18n="interface.circuit_intrusion_connect_source_to_target"></span></div>
            </div>

            <div class="ctos-meters">
                <div class="meter-box time-meter">
                    <div class="meter-label">
                        <span><span data-i18n="interface.trace_time"></span></span>
                        <strong id="hud-time">35.0s</strong>
                    </div>
                    <div class="meter-track">
                        <div class="meter-bar" id="hud-time-bar"></div>
                    </div>
                </div>

                <div class="meter-box signal-meter">
                    <div class="meter-label">
                        <span><span data-i18n="interface.signal"></span></span>
                        <strong id="hud-signal"><span data-i18n="interface.online"></span></strong>
                    </div>
                    <div class="signal-bars">
                        <span class="sig-bar active"></span>
                        <span class="sig-bar active"></span>
                        <span class="sig-bar active"></span>
                        <span class="sig-bar active"></span>
                        <span class="sig-bar"></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Watch Dogs Puzzle Container (with 3D Parallax & SVG Network) -->
        <div class="puzzle-container" id="puzzle-container">
            <svg id="network-svg" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
                <!-- Layer 1: Dark Under-Stroke / Shadow for Crisp Contrast -->
                <g id="edges-shadow-layer"></g>

                <!-- Layer 2: Inactive Neutral Physical Cable Edges -->
                <g id="edges-base-layer"></g>

                <!-- Layer 3: Energized Flow Edges with Dashoffset Sweep -->
                <g id="edges-power-layer"></g>

                <!-- Layer 3: Interactive Circular & Diamond Nodes -->
                <g id="nodes-layer"></g>

                <!-- Layer 4: Shockwave & Particle Effects -->
                <g id="effects-layer"></g>
            </svg>

            <!-- Glitching Win Message -->
            <div id="success-message"><span data-i18n="interface.system_override"></span></div>
        </div>

        <!-- Minimal ctOS Footer Controls & Objective Status -->
        <footer class="ctos-footer">
            <div class="ctos-status-line">
                <span class="status-bracket">[</span>
                <span id="hud-status" class="status-text"><span data-i18n="interface.network_mapped_rotate_nodes_to_power_the_target"></span></span>
                <span class="status-bracket">]</span>
            </div>

            <div class="ctos-hints">
                <div class="hint-item"><kbd><span data-i18n="interface.left_click"></span></kbd> <span><span data-i18n="interface.rotate_90"></span></span></div>
                <div class="hint-item"><kbd><span data-i18n="interface.right_click"></span></kbd> <span><span data-i18n="interface.rotate_counterclockwise"></span></span></div>
                <div class="hint-item" id="hint-cancel"><kbd>ESC</kbd> <span><span data-i18n="interface.cancel"></span></span></div>
            </div>
        </footer>

        <!-- Custom Watch Dogs Targeting Crosshair Cursor -->
        <div id="cursor">
            <div class="cursor-center"></div>
            <div class="cursor-brackets">
                <div class="bracket tl"></div>
                <div class="bracket tr"></div>
                <div class="bracket bl"></div>
                <div class="bracket br"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="nui://sunset_ui/web/js/i18n.generated.js"></script>
    <script src="nui://sunset_ui/web/js/i18n.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
